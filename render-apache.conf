
<VirtualHost *:10000>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Conserver les anciens chemins /patisserie_MVC/
    Alias /patisserie_MVC /var/www/html

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # Protéger les fichiers de configuration
    <Directory /var/www/html/config>
        Require all denied
    </Directory>

    # Page de connexion existante à l'ouverture du site
    RedirectMatch 302 ^/$ /patisserie_MVC/views/login.php

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
